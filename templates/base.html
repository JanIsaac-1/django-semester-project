<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Internship Hub{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            line-height: 1.6;
            color: #333;
        }
        nav {
            margin: 15px 0 25px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid #ccc;
        }
        nav a {
            margin-right: 15px;
            color: #0066cc;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
        footer {
            margin-top: 40px;
            padding-top: 10px;
            border-top: 1px solid #ccc;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <h1>Campus Career & Internship Hub</h1>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'job_list' %}">Jobs</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>API &ndash; Application Programming for the Internet &bull; Django Semester Project</p>
    </footer>
</body>
</html>
