{% extends 'base.html' %}

{% block title %}Change Password - Internship Hub{% endblock %}

{% block content %}
<div class="box form-box">
    <h2 style="margin: 0 0 6px 0;">Change Password</h2>
    <p class="meta" style="margin: 0 0 18px 0;">Enter your current password followed by your new password.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button type="submit">Update Password</button>
            <a href="{% url 'profile' %}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
