{% extends 'base.html' %}

{% block title %}Register - Internship Hub{% endblock %}

{% block content %}
<div class="box form-box">
    <h2 style="margin-top: 0;">Create an Account</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>

    <p style="margin: 16px 0 0 0;">Already have an account? <a href="{% url 'login' %}">Login here</a>.</p>
</div>
{% endblock %}
