{% extends 'base.html' %}

{% block title %}Password Updated - Internship Hub{% endblock %}

{% block content %}
<div class="box form-box" style="text-align: center;">
    <span class="tag tag-accepted" style="margin-bottom: 12px;">Updated</span>
    <h2 style="margin: 0 0 8px 0;">Password Changed Successfully</h2>
    <p class="meta" style="margin-bottom: 20px;">Your account password has been updated.</p>
    <div class="actions" style="justify-content: center;">
        <a href="{% url 'profile' %}" class="btn">Back to Profile</a>
        <a href="{% url 'job_list' %}" class="btn-secondary">Browse Jobs</a>
    </div>
</div>
{% endblock %}
